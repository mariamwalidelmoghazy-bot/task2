              <section>
                <h2>عرض الموضوع وفصول البحث</h2>
                <h3>الفصل الأول: المفھوم الأساسي والأھمیة لـ CSS</h3>
                <p>1-ما هي لغة css
                    cssتعرف بانها اوراق 
                    الانماط المتتالية (Cascading Style Sheets)
                    وهي لغة تصميم تستخدم لتوصيف مظهر وتقسيم العناصر المكتوبه بلغة ترميز مثل html او xml 
                    تحددcss كيفية عرض العناصر علي الشاشات والمطبوعات او الوسائط الاخري 
                    2-أھمیة لغة  CSSوفوائدھا الرئیسيه
                    .فصل المحتوي عن التصميم
                    .تسريع تحميل الصفحات
                    .التصميم المتجاوب
                    .تسهيل الصيانة
                </p>
                <h3>الفصل الثاني : طرق دمج htmlمع صفحات CSS</h3>
                <p>1-النمط الداخلي المباشر
                    2-النمط الداخلي في راس الصفحة 
                    3- الملف الخارجي
                </p>
                <h3>الهيكل الاساسي ومحددات الفصل التالت css</h3>
                <p>انواع المحددات الرئسيه في css
                    1-محدد العنصر (Element Selector)
                    2-محدد الفئه (Class Selector)
                    3-محدد المعرف (ID Selector)
                </p>
                <h3>الفصل الرابع:المحددات ونموذج الصندوق</h3>
                <p>1-المحتوي
                    2-المسافه الداخلية
                    3-الحدود
                    4-المسافه الخارجيه
                    
                </p>
                <h3>الفصل الخامس التخطيط الحديث والتصميم المتجاوب</h3>
                <p>1-flexbox (flexible box layout)
                    2- css grid layout
                </p>
